[colors]
bg       = #282828
fg       = #ebdbb2
yellow   = #d79921
orange   = #d65d0e
red      = #cc241d
green    = #98971a
blue     = #458588
purple   = #b16286
aqua     = #689d6a
gray     = #a89984
darkgray = #1d2021

[bar/base]
; monitor is set per-instance via the MONITOR env var in launch.sh
; https://github.com/polybar/polybar/wiki/Configuration#running-polybar-on-multiple-monitors
monitor    = ${env:MONITOR:}
width      = 100%
height     = 27
background = ${colors.bg}
foreground = ${colors.fg}

font-0 = terminus:size=14:antialias=true

padding-left  = 1
padding-right = 1
module-margin = 1

wm-restack = bspwm

[bar/top]
inherit = bar/base
bottom  = false
modules-right = cpu battery volume date

[bar/bottom]
inherit = bar/base
bottom  = true
modules-left  = bspwm
modules-right = network wired-network

[module/bspwm]
type = internal/bspwm

label-focused            = %name%
label-focused-background = ${colors.yellow}
label-focused-foreground = ${colors.bg}
label-focused-padding    = 1

label-occupied            = %name%
label-occupied-foreground = ${colors.blue}
label-occupied-padding    = 1

label-urgent            = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding    = 1

label-empty            = %name%
label-empty-foreground = ${colors.gray}
label-empty-padding    = 1

[module/date]
type     = internal/date
interval = 1
date     = %Y-%m-%d
time     = %H:%M:%S
label    = %{F#8ec07c}%date%%{F-}  %{F#fabd2f}%time%%{F-}

[module/cpu]
type     = internal/cpu
interval = 1
label    = %{F#fb4934}CPU%{F-} %percentage%%

[module/volume]
type          = internal/pulseaudio
use-ui-max    = false
label-volume  = %{F#d3869b}VOL%{F-} %percentage%%
label-muted   = %{F#a89984}MUTE%{F-}

[module/battery]
type               = internal/battery
battery            = BAT0
adapter            = AC
full-at            = 100
label-charging     = %{F#8ec07c}CHG%{F-} %percentage%%
label-discharging  = %{F#fabd2f}BAT%{F-} %percentage%%
label-full         = %{F#8ec07c}FULL%{F-}

[module/network]
type           = internal/network
interface-type = wireless
label-connected    = %{F#689d6a}%essid%%{F-}  %{F#458588}↓%downspeed%%{F-}  %{F#d65d0e}↑%upspeed%%{F-}

[module/wired-network]
type           = internal/network
interface-type = wired
label-connected    = %{F#689d6a}ETH%{F-} %local_ip%  %{F#458588}↓%downspeed%%{F-}  %{F#d65d0e}↑%upspeed%%{F-}
