[colors]
bg       = #1d2021
fg       = #fbf1c7
yellow   = #fabd2f
orange   = #fe8019
red      = #fb4934
green    = #b8bb26
blue     = #83a598
purple   = #d3869b
aqua     = #8ec07c
gray     = #bdae93
darkgray = #1d2021

[bar/main]
width      = 100%
height     = 27
bottom     = true
background = ${colors.bg}
foreground = ${colors.fg}

font-0 = terminus:size=14:antialias=true

padding-left  = 1
padding-right = 1
module-margin = 1

modules-left   = i3
modules-center = date
modules-right  = network cpu battery volume 

wm-restack = i3

[module/i3]
type = internal/i3
index-sort = true
pin-workspaces = true

label-focused            = %name%
label-focused-background = ${colors.yellow}
label-focused-foreground = ${colors.bg}
label-focused-padding    = 1

; i3 only shows workspaces that exist, so there's no "empty" state
label-unfocused            = %name%
label-unfocused-foreground = ${colors.blue}
label-unfocused-padding    = 1

; focused on another monitor
label-visible            = %name%
label-visible-foreground = ${colors.yellow}
label-visible-padding    = 1

label-urgent            = %name%
label-urgent-background = ${colors.red}
label-urgent-foreground = ${colors.bg}
label-urgent-padding    = 1

[module/date]
type     = internal/date
interval = 1
date     = %Y-%m-%d
time     = %H:%M:%S
label    = %{F#b8bb26}%date%%{F-}  %{F#fabd2f}%time%%{F-}

[module/cpu]
type     = internal/cpu
interval = 1
label    = %{F#fb4934}CPU%{F-} %percentage%%

[module/volume]
type          = internal/pulseaudio
label-volume  = %{F#d3869b}VOL%{F-} %percentage%%
label-muted   = %{F#928374}MUTE%{F-}

[module/battery]
type               = internal/battery
battery            = BAT0
adapter            = AC
full-at            = 98
label-charging     = %{F#b8bb26}CHG%{F-} %percentage%%
label-discharging  = %{F#fabd2f}BAT%{F-} %percentage%%
label-full         = %{F#b8bb26}FULL%{F-}

[module/network]
type      = internal/network
interface = wlp0s20f3
interval  = 2

label-connected    = %{F#8ec07c}%essid%%{F-}  %{F#83a598}↓%downspeed%%{F-}  %{F#fe8019}↑%upspeed%%{F-}
label-disconnected = %{F#fb4934}no network%{F-}
